[project]
name = "scheduler"
dynamic = ["version"]
description = "Cron scheduler service for dispatch-managed scheduled runs"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "aiomysql>=0.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "croniter>=2.0.0,<7",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# 仅从行内批准的软件源安装；未安装时保留缓存及明确的日历降级。
workday-auth = ["ZA33_CMBSM==1.17.43"]

[tool.setuptools.dynamic]
version = {attr = "scheduler.__version__.__version__"}

[tool.setuptools]
packages = { find = { where = ["src"] } }
include-package-data = true

[tool.setuptools.package-data]
"scheduler" = [
    "config/envs/*.json",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
scheduler = "scheduler.cli.main:cli"
