apiVersion: batch/v1
kind: Job
metadata:
  name: swe-session-nas-lock-verification
  labels:
    app: swe-session-nas-lock-verification
spec:
  backoffLimit: 0
  completions: 2
  parallelism: 2
  completionMode: Indexed
  template:
    metadata:
      labels:
        app: swe-session-nas-lock-verification
    spec:
      restartPolicy: Never
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: swe-session-nas-lock-verification
              topologyKey: kubernetes.io/hostname
      containers:
        - name: verifier
          image: agentscope/swe:latest
          command: ["python3", "/app/scripts/verify_session_nas_lock.py", "/mnt/sessions", "--mode", "indexed"]
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
          volumeMounts:
            - name: sessions
              mountPath: /mnt/sessions
      volumes:
        - name: sessions
          persistentVolumeClaim:
            claimName: swe-sessions-nas
